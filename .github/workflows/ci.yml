name: Check C code

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  formatting-check:
    name: Format, build and test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      - name: Run clang-format check
        run: |
          find . -path ./build -prune -o -type f -name '*.[c|h]' -print | xargs clang-format --style=file --dry-run -Werror

      - name: Configure
        run: |
          cmake src -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: |
          cmake --build build
      - name: Test
        run: |
          ctest --test-dir build --output-on-failure
      - name: Lint
        run: |
          run-clang-tidy-18 -p=build